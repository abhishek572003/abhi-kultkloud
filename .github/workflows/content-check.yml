name: Weekly content check

on:
  schedule:
    - cron: "0 3 * * 1" # every Monday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check every resource link
        id: check
        run: node scripts/check-links.mjs
        continue-on-error: true
      - name: Open an issue for broken links
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Broken resource links ($(date -u +%Y-%m-%d))" --body-file broken-links.md
